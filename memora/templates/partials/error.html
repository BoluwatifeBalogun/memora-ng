{% import "partials/ui.html" as ui %}
<!doctype html>
<html lang="en">
<head><title>{{ title }} · Memora NG</title>{% include "partials/head.html" %}</head>
<body class="solo">
  <div class="grain" aria-hidden="true"></div>
  <main class="solo-main">
    <a href="{{ url_for('public.home') }}" class="solo-logo" aria-label="Memora NG home">{{ ui.logo() }}</a>
    <p class="err-code">{{ code }}</p>
    <h1 class="h2">{{ title }}</h1>
    {% if message %}<p class="lead">{{ message }}</p>{% endif %}
    <div class="row-actions center">
      <a class="btn btn-gold" href="{{ url_for('workspace.dashboard') if user else url_for('public.home') }}">{{ 'Back to the workspace' if user else 'Back to the home page' }}</a>
    </div>
  </main>
</body>
</html>
